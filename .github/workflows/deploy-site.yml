name: Build and Deploy Site

# Triggers:
# 1. Automatically after the scraper workflow completes (so fresh data is
#    always baked into the build)
# 2. Manually from the Actions tab whenever you want to force a rebuild
# 3. On any direct push to main (so code changes also trigger a redeploy)

on:
  workflow_run:
    workflows: ["Update Volunteer Opportunities"]
    types: [completed]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - 'scraper/**'       # don't re-trigger on scraper-only changes
      - '.github/workflows/update-opportunities.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Only run if the triggering scraper workflow succeeded (or if triggered
    # manually / by a push, in which case workflow_run.conclusion is not set)
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Fetch the full history so the push step can work correctly
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # Prevents Vite treating warnings as errors during CI build
          CI: false

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Keeps your custom domain (volunteerhigh.org) intact on every deploy
          cname: volunteerhigh.org
